<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Provider Camera</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700&amp;family=Noto+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2badee",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101c22",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"],
                        "body": ["Noto Sans", "sans-serif"],
                    },
                    borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Custom scrollbar hide for cleaner UI */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display antialiased overflow-hidden selection:bg-primary selection:text-white">
<!-- Main Wrapper: Full Screen Camera UI -->
<div class="relative h-[100dvh] w-full flex flex-col bg-black text-white overflow-hidden group/design-root">
<!-- Background / Viewfinder -->
<div class="absolute inset-0 z-0">
<!-- Simulated Camera Feed -->
<img class="w-full h-full object-cover opacity-90" data-alt="Camera viewfinder showing a blurred modern interior" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAI6W_uI0v3iJK0MA6T7yFiBciVHSAzHIsOhS4iMHElnCz7K0Pummn8RP1PEh4-oP0kf2hkiObC7B3l-gzPTpZIWHkwHM1chFZ6VYBXMjbvegne0xraWKc0T1OWqtVYpaaIG9flrwfaMTvI1nGjSrA-hWH8BKSlqQhGCzM2MxwENces79XHYNMeY8hFmGChF1goXA9_Iam64ge7AE1IoR68vBIqDcz68AzpPieWTxrf7CLMhI-7K71J2I1w0JOGi_rLSkbE37jrfOw"/>
<!-- Gradient Overlay for UI Visibility -->
<div class="absolute inset-0 bg-gradient-to-b from-black/60 via-transparent to-black/80 pointer-events-none"></div>
</div>
<!-- Top Controls Bar -->
<div class="relative z-30 pt-4 px-4 pb-2 flex items-center justify-between mt-8 lg:mt-4">
<!-- Close Button -->
<button class="flex items-center justify-center size-10 rounded-full bg-black/20 backdrop-blur-md text-white hover:bg-black/40 transition-colors">
<span class="material-symbols-outlined text-[24px]">close</span>
</button>
<!-- Add Sound Pill -->
<button class="flex items-center justify-center px-4 h-10 gap-2 rounded-full bg-black/30 backdrop-blur-md text-white text-sm font-bold border border-white/10 hover:bg-black/50 transition-all">
<span class="material-symbols-outlined text-[20px]">music_note</span>
<span>Add Sound</span>
</button>
<!-- Top Right: Flash & Settings -->
<div class="flex items-center gap-2">
<button class="flex items-center justify-center size-10 rounded-full bg-black/20 backdrop-blur-md text-white hover:bg-black/40 transition-colors">
<span class="material-symbols-outlined text-[24px]">flash_on</span>
</button>
</div>
</div>
<!-- Vertical Sidebar Tools -->
<div class="absolute right-4 top-24 z-30 flex flex-col items-center gap-6">
<!-- Flip Camera -->
<button class="group flex flex-col items-center gap-1">
<div class="flex items-center justify-center size-10 rounded-full bg-black/10 backdrop-blur-sm group-hover:bg-black/30 transition-colors">
<span class="material-symbols-outlined text-[28px] drop-shadow-md">flip_camera_ios</span>
</div>
<span class="text-[10px] font-bold drop-shadow text-white/90">Flip</span>
</button>
<!-- Speed -->
<button class="group flex flex-col items-center gap-1">
<div class="flex items-center justify-center size-10 rounded-full bg-black/10 backdrop-blur-sm group-hover:bg-black/30 transition-colors">
<span class="material-symbols-outlined text-[28px] drop-shadow-md">speed</span>
</div>
<span class="text-[10px] font-bold drop-shadow text-white/90">Speed</span>
</button>
<!-- Filters -->
<button class="group flex flex-col items-center gap-1">
<div class="flex items-center justify-center size-10 rounded-full bg-black/10 backdrop-blur-sm group-hover:bg-black/30 transition-colors">
<span class="material-symbols-outlined text-[28px] drop-shadow-md">auto_fix_high</span>
</div>
<span class="text-[10px] font-bold drop-shadow text-white/90">Filters</span>
</button>
<!-- Timer -->
<button class="group flex flex-col items-center gap-1">
<div class="flex items-center justify-center size-10 rounded-full bg-black/10 backdrop-blur-sm group-hover:bg-black/30 transition-colors">
<span class="material-symbols-outlined text-[28px] drop-shadow-md">timer</span>
</div>
<span class="text-[10px] font-bold drop-shadow text-white/90">Timer</span>
</button>
<!-- Link Service (Highlight) -->
<button class="group flex flex-col items-center gap-1 mt-2">
<div class="flex items-center justify-center size-12 rounded-full bg-primary/20 border border-primary backdrop-blur-sm group-hover:bg-primary/30 transition-colors shadow-[0_0_15px_rgba(43,173,238,0.3)]">
<span class="material-symbols-outlined text-[24px] text-primary drop-shadow-md">confirmation_number</span>
</div>
<span class="text-[10px] font-bold drop-shadow text-primary">Link Service</span>
</button>
</div>
<!-- Spacer to push bottom content down -->
<div class="flex-1"></div>
<!-- Bottom Controls Area -->
<div class="relative z-30 pb-8 pt-12 flex flex-col items-center w-full bg-gradient-to-t from-black/90 via-black/40 to-transparent">
<!-- Mode Selector (Tabs) -->
<div class="flex items-center justify-center gap-8 mb-6 overflow-x-auto no-scrollbar w-full px-4">
<button class="text-white/60 text-sm font-bold tracking-wide hover:text-white transition-colors">Story</button>
<button class="text-white bg-white/10 backdrop-blur-md px-4 py-1.5 rounded-full text-sm font-bold tracking-wide border border-white/20 shadow-lg">Video</button>
<button class="text-white/60 text-sm font-bold tracking-wide hover:text-white transition-colors">Live</button>
</div>
<!-- Shutter & Actions Row -->
<div class="flex items-center justify-between w-full px-6 max-w-md mx-auto">
<!-- Gallery Thumb -->
<div class="flex-1 flex justify-start">
<button class="size-12 rounded-lg overflow-hidden border-2 border-white/80 shadow-lg hover:scale-105 transition-transform active:scale-95">
<img class="w-full h-full object-cover" data-alt="Gallery thumbnail showing recent photo" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC-7aaJUdZM_PyhjnX4wn_ZC8OqTpYSF_0bkZ4s9yuoyL9DLRytnzXtA0A-bouzDRtik3PZKPoKadK8Du46rUrRn0oKQoBHryYdaRgcYgvPAzaiY5DGeLSGLTPBd5eZavbYtu4yAh1OgWe5d-h3BP5_jLc5KuA0M3CdTPB1hR_s5KFHxeZlHg_875whiui9zQRZSXeSL7vV9leN9oeNk02HMEBvf_Nx2-n0NfniS9g4WzQE88C9-zLHFp7jkDJYaKqcqSrnFHh-NLI"/>
</button>
</div>
<!-- Shutter Button -->
<div class="flex-1 flex justify-center">
<button class="relative size-20 rounded-full border-[5px] border-white/90 bg-transparent flex items-center justify-center hover:scale-105 transition-all duration-300 group">
<!-- Recording Indicator / Inner Circle -->
<div class="size-16 rounded-full bg-primary group-active:scale-90 group-active:rounded-lg transition-all duration-200 shadow-[0_0_20px_rgba(43,173,238,0.5)]"></div>
</button>
</div>
<!-- Next Button (Pill adaptation) -->
<div class="flex-1 flex justify-end">
<button class="flex items-center justify-center gap-1 pl-4 pr-3 h-12 bg-white text-background-dark rounded-full font-bold text-sm hover:bg-primary hover:text-white transition-all shadow-lg active:scale-95">
<span>Next</span>
<span class="material-symbols-outlined text-[20px]">chevron_right</span>
</button>
</div>
</div>
</div>
</div>
</body></html>
