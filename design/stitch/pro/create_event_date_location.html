<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Create Event: Date &amp; Location</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2badee",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101c22",
                        "surface-dark": "#192b33",
                        "border-dark": "#325567",
                        "text-secondary": "#92b7c9",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        /* Custom scrollbar for better aesthetics */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #101c22;
        }
        ::-webkit-scrollbar-thumb {
            background: #325567;
            border-radius: 4px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display antialiased text-gray-900 dark:text-white min-h-screen flex justify-center">
<div class="w-full max-w-md h-full min-h-screen flex flex-col relative bg-background-light dark:bg-background-dark shadow-xl overflow-hidden">
<!-- Header -->
<header class="flex items-center p-4 pb-2 justify-between z-10 sticky top-0 bg-background-light dark:bg-background-dark">
<button class="text-gray-900 dark:text-white flex size-10 shrink-0 items-center justify-center rounded-full hover:bg-gray-200 dark:hover:bg-surface-dark transition-colors">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h2 class="text-gray-900 dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-10">Create Event</h2>
</header>
<!-- Progress Indicators -->
<div class="px-6 py-4">
<div class="flex items-center justify-between mb-2">
<span class="text-xs font-semibold text-primary uppercase tracking-wider">Step 2 of 4</span>
<span class="text-xs text-text-secondary">Logistics</span>
</div>
<div class="flex w-full flex-row items-center justify-center gap-2">
<div class="h-1.5 flex-1 rounded-full bg-primary/30"></div>
<div class="h-1.5 flex-1 rounded-full bg-primary"></div>
<div class="h-1.5 flex-1 rounded-full bg-primary/20 dark:bg-surface-dark"></div>
<div class="h-1.5 flex-1 rounded-full bg-primary/20 dark:bg-surface-dark"></div>
</div>
</div>
<!-- Content Scroll Area -->
<div class="flex-1 overflow-y-auto pb-24 px-4">
<!-- Headline -->
<div class="pt-2 pb-6">
<h1 class="text-gray-900 dark:text-white tracking-tight text-3xl font-bold leading-tight">When &amp; Where?</h1>
<p class="text-gray-500 dark:text-text-secondary text-sm mt-1">Let guests know the location and time details.</p>
</div>
<!-- Date & Time Section -->
<section class="mb-8 space-y-5">
<!-- Date Input -->
<div class="group">
<label class="block text-gray-700 dark:text-white text-sm font-medium mb-2">Event Date</label>
<div class="relative flex items-center">
<input class="w-full bg-white dark:bg-surface-dark border border-gray-200 dark:border-border-dark rounded-xl px-4 py-3.5 pl-11 text-base text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-text-secondary focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all" placeholder="Select date" type="text"/>
<span class="material-symbols-outlined absolute left-3.5 text-primary">calendar_month</span>
</div>
</div>
<!-- Time Inputs -->
<div class="flex gap-4">
<div class="flex-1 group">
<label class="block text-gray-700 dark:text-white text-sm font-medium mb-2">Start Time</label>
<div class="relative flex items-center">
<input class="w-full bg-white dark:bg-surface-dark border border-gray-200 dark:border-border-dark rounded-xl px-4 py-3.5 pl-11 text-base text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-text-secondary focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all" placeholder="00:00" type="text"/>
<span class="material-symbols-outlined absolute left-3.5 text-primary">schedule</span>
</div>
</div>
<div class="flex-1 group">
<label class="block text-gray-700 dark:text-white text-sm font-medium mb-2">End Time</label>
<div class="relative flex items-center">
<input class="w-full bg-white dark:bg-surface-dark border border-gray-200 dark:border-border-dark rounded-xl px-4 py-3.5 pl-11 text-base text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-text-secondary focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all" placeholder="00:00" type="text"/>
<span class="material-symbols-outlined absolute left-3.5 text-primary">schedule</span>
</div>
</div>
</div>
<!-- Timezone Hint -->
<div class="flex items-center gap-2 text-xs text-gray-500 dark:text-text-secondary px-1">
<span class="material-symbols-outlined text-[16px]">public</span>
<span>Times are displayed in your local timezone (GMT-5)</span>
</div>
</section>
<!-- Divider -->
<div class="h-px bg-gray-200 dark:bg-border-dark w-full mb-8"></div>
<!-- Location Section -->
<section class="mb-8 space-y-6">
<!-- Segmented Control -->
<div class="p-1 bg-gray-200 dark:bg-surface-dark rounded-xl flex relative">
<!-- Active Indicator Background (visually simulated by classes on buttons) -->
<label class="flex-1 text-center relative cursor-pointer z-10">
<input checked="" class="peer sr-only" name="location_type" type="radio" value="in-person"/>
<div class="py-2.5 text-sm font-medium rounded-lg text-gray-500 dark:text-text-secondary transition-all peer-checked:bg-white dark:peer-checked:bg-background-dark peer-checked:text-primary peer-checked:shadow-sm">
                            In-Person
                        </div>
</label>
<label class="flex-1 text-center relative cursor-pointer z-10">
<input class="peer sr-only" name="location_type" type="radio" value="online"/>
<div class="py-2.5 text-sm font-medium rounded-lg text-gray-500 dark:text-text-secondary transition-all peer-checked:bg-white dark:peer-checked:bg-background-dark peer-checked:text-primary peer-checked:shadow-sm">
                            Online
                        </div>
</label>
</div>
<!-- Dynamic Location Fields -->
<div class="space-y-5 animate-fade-in">
<!-- Venue Name -->
<div>
<label class="block text-gray-700 dark:text-white text-sm font-medium mb-2">Venue Name</label>
<div class="relative flex items-center">
<input class="w-full bg-white dark:bg-surface-dark border border-gray-200 dark:border-border-dark rounded-xl px-4 py-3.5 pl-11 text-base text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-text-secondary focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all" placeholder="e.g. Grand Convention Center" type="text"/>
<span class="material-symbols-outlined absolute left-3.5 text-primary">apartment</span>
</div>
</div>
<!-- Address Autocomplete -->
<div>
<label class="block text-gray-700 dark:text-white text-sm font-medium mb-2">Address</label>
<div class="relative flex items-center">
<input class="w-full bg-white dark:bg-surface-dark border border-gray-200 dark:border-border-dark rounded-xl px-4 py-3.5 pl-11 pr-10 text-base text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-text-secondary focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all" placeholder="Search for location" type="text"/>
<span class="material-symbols-outlined absolute left-3.5 text-primary">location_on</span>
<span class="material-symbols-outlined absolute right-3.5 text-gray-400 dark:text-text-secondary cursor-pointer hover:text-white">my_location</span>
</div>
</div>
<!-- Map Preview Placeholder -->
<div class="w-full h-32 rounded-xl bg-gray-100 dark:bg-surface-dark border border-gray-200 dark:border-border-dark overflow-hidden relative group cursor-pointer">
<img class="w-full h-full object-cover opacity-60 group-hover:opacity-80 transition-opacity" data-alt="Map view of city streets with location pin" data-location="New York City" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAKY0OU0OOb9kFIl-MSgHl5iXRUD95JVN7stGQL2iH3B3PYMdi9JwmBpx_CxKQAa3B3Z-b66lk4qeZUsrd0vo4N7VUeQu_okVpkAwORfwS_2q6wV3zPWcRSfPOxqZNQEDTD1uXAbb02SKVglu1cMX9eq1z-YRevDCT0n_4gMYbtBi-AfGdtlMOqDNtBJhflMD8jkhKTLcTd5xNxosxRROg0qeY4iR01_KCZKcT5b-WqpnA_1pmwehkQE1732st_Sg9LFLLUiBNt6-Q"/>
<div class="absolute inset-0 flex items-center justify-center">
<div class="bg-background-dark/80 backdrop-blur-sm px-3 py-1.5 rounded-full flex items-center gap-1.5">
<span class="material-symbols-outlined text-primary text-sm">map</span>
<span class="text-xs font-medium text-white">Adjust on map</span>
</div>
</div>
</div>
</div>
</section>
</div>
<!-- Sticky Footer Action -->
<div class="absolute bottom-0 left-0 w-full bg-background-light/95 dark:bg-background-dark/95 backdrop-blur-md border-t border-gray-200 dark:border-border-dark p-4 z-20">
<button class="w-full bg-primary hover:bg-primary/90 text-white font-bold text-base py-3.5 rounded-xl shadow-lg shadow-primary/20 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
<span>Continue</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
</div>
</body></html>
