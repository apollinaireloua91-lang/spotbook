<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Create Event: Tickets &amp; Pricing</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=Noto+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2badee",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101c22",
                        "surface-dark": "#1c2a33",
                        "surface-darker": "#152228",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"],
                        "body": ["Noto Sans", "sans-serif"],
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "2xl": "1rem", "full": "9999px" },
                },
            },
        }
    </script>
<style>
        /* Custom scrollbar for clean look */
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }
        
        /* Remove default date picker icon for custom styling if needed, but keeping standard for now */
        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
            opacity: 0.6;
            cursor: pointer;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-white antialiased overflow-x-hidden">
<div class="relative flex h-full min-h-screen w-full flex-col max-w-md mx-auto bg-background-light dark:bg-background-dark shadow-2xl">
<!-- TopAppBar -->
<div class="sticky top-0 z-50 flex items-center bg-background-light dark:bg-background-dark p-4 pb-2 justify-between border-b border-gray-200 dark:border-gray-800/50 backdrop-blur-md bg-opacity-95 dark:bg-opacity-95">
<button class="text-slate-900 dark:text-white flex size-12 shrink-0 items-center justify-center rounded-full active:bg-gray-200 dark:active:bg-gray-800 transition-colors">
<span class="material-symbols-outlined" style="font-size: 24px;">arrow_back</span>
</button>
<h2 class="text-slate-900 dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center">Create Event</h2>
<button class="flex w-12 items-center justify-end rounded-full h-10 px-2 active:bg-gray-200 dark:active:bg-gray-800 transition-colors">
<p class="text-primary text-base font-bold leading-normal tracking-[0.015em] shrink-0">Save</p>
</button>
</div>
<!-- PageIndicators -->
<div class="flex w-full flex-row items-center justify-center gap-2 py-4 px-4">
<div class="h-1.5 flex-1 rounded-full bg-slate-300 dark:bg-[#325567]"></div>
<div class="h-1.5 flex-1 rounded-full bg-slate-300 dark:bg-[#325567]"></div>
<div class="h-1.5 flex-1 rounded-full bg-primary shadow-[0_0_8px_rgba(43,173,238,0.5)]"></div>
<div class="h-1.5 flex-1 rounded-full bg-slate-300 dark:bg-[#325567]"></div>
<div class="h-1.5 flex-1 rounded-full bg-slate-300 dark:bg-[#325567]"></div>
</div>
<div class="flex-1 overflow-y-auto pb-24">
<!-- HeadlineText -->
<h1 class="text-slate-900 dark:text-white tracking-tight text-[28px] md:text-[32px] font-bold leading-tight px-5 text-left pt-2">
                Tickets &amp; Pricing
            </h1>
<!-- BodyText -->
<p class="text-slate-500 dark:text-[#93A2B7] text-base font-normal leading-normal pb-6 pt-2 px-5">
                Define your ticket types, pricing, and availability.
            </p>
<!-- Ticket Tier Card 1 -->
<div class="px-4 mb-4">
<div class="bg-white dark:bg-surface-dark rounded-2xl p-5 shadow-sm border border-gray-100 dark:border-gray-800">
<div class="flex justify-between items-center mb-5">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary">confirmation_number</span>
<h3 class="text-slate-900 dark:text-white text-lg font-bold leading-tight">Ticket Tier 1</h3>
</div>
<button class="text-slate-400 hover:text-red-500 dark:text-gray-500 dark:hover:text-red-400 transition-colors">
<span class="material-symbols-outlined">delete</span>
</button>
</div>
<div class="space-y-5">
<!-- Ticket Name -->
<div class="flex flex-col gap-1.5">
<label class="text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 ml-1">Ticket Name</label>
<input class="w-full bg-slate-50 dark:bg-surface-darker text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-gray-500 rounded-xl border-0 ring-1 ring-slate-200 dark:ring-gray-700 focus:ring-2 focus:ring-primary px-4 py-3 text-base outline-none transition-all" placeholder="e.g. General Admission" type="text" value="General Admission"/>
</div>
<!-- Price & Quantity Row -->
<div class="grid grid-cols-2 gap-4">
<div class="flex flex-col gap-1.5">
<label class="text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 ml-1">Price</label>
<div class="relative">
<span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 dark:text-gray-500 font-medium">$</span>
<input class="w-full bg-slate-50 dark:bg-surface-darker text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-gray-500 rounded-xl border-0 ring-1 ring-slate-200 dark:ring-gray-700 focus:ring-2 focus:ring-primary pl-8 pr-4 py-3 text-base outline-none transition-all" placeholder="0.00" type="number" value="25.00"/>
</div>
</div>
<div class="flex flex-col gap-1.5">
<label class="text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 ml-1">Quantity</label>
<input class="w-full bg-slate-50 dark:bg-surface-darker text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-gray-500 rounded-xl border-0 ring-1 ring-slate-200 dark:ring-gray-700 focus:ring-2 focus:ring-primary px-4 py-3 text-base outline-none transition-all" placeholder="100" type="number" value="150"/>
</div>
</div>
<!-- Free Event Toggle (Optional inside card) -->
<div class="flex items-center justify-between py-1">
<span class="text-sm font-medium text-slate-600 dark:text-slate-300 ml-1">Is this a free ticket?</span>
<label class="relative inline-flex items-center cursor-pointer">
<input class="sr-only peer" type="checkbox" value=""/>
<div class="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer dark:bg-gray-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-gray-600 peer-checked:bg-primary"></div>
</label>
</div>
<div class="h-px bg-slate-100 dark:bg-gray-700 w-full"></div>
<!-- Dates -->
<div class="grid grid-cols-2 gap-4">
<div class="flex flex-col gap-1.5">
<label class="text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 ml-1">Sales Start</label>
<div class="relative">
<input class="w-full bg-slate-50 dark:bg-surface-darker text-slate-900 dark:text-white rounded-xl border-0 ring-1 ring-slate-200 dark:ring-gray-700 focus:ring-2 focus:ring-primary px-4 py-3 text-sm outline-none transition-all" type="date" value="2023-10-24"/>
</div>
</div>
<div class="flex flex-col gap-1.5">
<label class="text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 ml-1">Sales End</label>
<div class="relative">
<input class="w-full bg-slate-50 dark:bg-surface-darker text-slate-900 dark:text-white rounded-xl border-0 ring-1 ring-slate-200 dark:ring-gray-700 focus:ring-2 focus:ring-primary px-4 py-3 text-sm outline-none transition-all" type="date" value="2023-11-20"/>
</div>
</div>
</div>
</div>
</div>
</div>
<!-- Ticket Tier Card 2 (Collapsed/Added State Example) -->
<div class="px-4 mb-4">
<div class="bg-white dark:bg-surface-dark rounded-2xl p-5 shadow-sm border border-gray-100 dark:border-gray-800 opacity-60 hover:opacity-100 transition-opacity">
<div class="flex justify-between items-center">
<div class="flex items-center gap-3">
<div class="bg-primary/20 p-2 rounded-lg">
<span class="material-symbols-outlined text-primary text-xl">star</span>
</div>
<div>
<h3 class="text-slate-900 dark:text-white text-base font-bold leading-tight">VIP Access</h3>
<p class="text-slate-500 dark:text-slate-400 text-sm">$150.00 • 20 left</p>
</div>
</div>
<button class="text-primary font-semibold text-sm px-3 py-1.5 rounded-lg bg-primary/10 hover:bg-primary/20 transition-colors">
                            Edit
                        </button>
</div>
</div>
</div>
<!-- Add Button -->
<div class="px-4 mt-2">
<button class="group flex w-full items-center justify-center gap-2 rounded-xl border border-dashed border-primary/40 dark:border-primary/30 bg-primary/5 p-4 hover:bg-primary/10 active:bg-primary/20 transition-all">
<span class="material-symbols-outlined text-primary group-hover:scale-110 transition-transform">add_circle</span>
<span class="text-primary font-bold text-base">Add Another Ticket Tier</span>
</button>
</div>
</div>
<!-- Sticky Footer -->
<div class="fixed bottom-0 left-0 right-0 max-w-md mx-auto z-40 bg-background-light dark:bg-background-dark border-t border-gray-200 dark:border-gray-800 p-4 pb-8">
<div class="flex items-center justify-between mb-4 px-1">
<div class="text-sm text-slate-500 dark:text-slate-400 font-medium">Est. Revenue</div>
<div class="text-lg text-slate-900 dark:text-white font-bold">$6,750.00</div>
</div>
<button class="w-full h-12 bg-primary hover:bg-sky-400 text-white font-bold rounded-xl text-base shadow-[0_4px_12px_rgba(43,173,238,0.4)] hover:shadow-[0_6px_16px_rgba(43,173,238,0.5)] active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                Continue
                <span class="material-symbols-outlined text-sm font-bold">arrow_forward</span>
</button>
</div>
</div>
</body></html>
