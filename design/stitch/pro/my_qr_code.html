<!DOCTYPE html>
<html class="dark" lang="fr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#00D4FF",
                        "background-dark": "#05050a",
                        "surface-dark": "#0f0f1a",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        @layer utilities {
            .bg-mesh {
                background-color: #05050a;
                background-image: 
                    radial-gradient(at 0% 0%, hsla(190,100%,30%,0.15) 0px, transparent 50%),
                    radial-gradient(at 100% 100%, hsla(190,100%,30%,0.15) 0px, transparent 50%);
            }
            .art-glass {
                background: rgba(255, 255, 255, 0.03);
                backdrop-filter: blur(20px);
                border: 1px solid rgba(255, 255, 255, 0.1);
            }
            .glow-text {
                text-shadow: 0 0 20px rgba(0, 212, 255, 0.6), 0 0 40px rgba(0, 212, 255, 0.2);
            }
            .qr-blob {
                position: relative;
                overflow: hidden;
            }
            .qr-blob::before {
                content: '';
                position: absolute;
                top: -50%;
                left: -50%;
                width: 200%;
                height: 200%;
                background: conic-gradient(from 0deg, transparent, #00D4FF, transparent, #00D4FF, transparent);
                opacity: 0.1;
            }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-mesh text-slate-100 min-h-screen flex flex-col font-display selection:bg-primary/30">
<header class="flex items-center justify-between p-6">
<button class="flex h-12 w-12 items-center justify-center rounded-full art-glass text-slate-100 transition-all active:scale-90">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="text-lg font-medium tracking-[0.2em] uppercase text-slate-400">Digital Identity</h1>
<div class="w-12"></div>
</header>
<main class="flex-1 flex flex-col items-center justify-center px-8 pb-24">
<div class="relative w-full max-w-sm">
<div class="absolute -inset-10 bg-primary/10 blur-[80px] rounded-full opacity-50"></div>
<div class="absolute top-0 right-0 w-32 h-32 bg-primary/20 blur-[60px] rounded-full"></div>
<div class="relative art-glass rounded-[4rem] p-4 flex flex-col items-center justify-center aspect-[4/5] overflow-hidden shadow-2xl">
<div class="relative w-full aspect-square flex items-center justify-center p-6">
<div class="absolute inset-0 border-[0.5px] border-primary/20 rounded-full scale-110"></div>
<div class="relative z-10 p-4 bg-white rounded-3xl overflow-hidden shadow-[0_0_50px_rgba(0,212,255,0.15)] group">
<img alt="Digital Art QR" class="w-full h-full object-contain mix-blend-multiply opacity-90" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDxE61QQgBxOJC5xIYj_C4otTh8Gw7DkPdjdh0vV8Rg4_H1RsqRbgA2wuRLQERUNc6ncPwPOKh4ZeYnAFVyVFZfoFtg473l3mCjyJ0lO9vPKKawlsXbWs4YdTwoHl0q5Qjtv3nfhhlnxxm8RAwNgU2BNfUiKZDVzqalNuXmsMXdH8IVFuMSHwCvbiFS4hadCM1guDrA3XRqf9swqmwGUcRiQqigWvk7DOCrY5QSiajGZWiMOBT4A72pWJNM7tmX-3Ord9rj366iHzY"/>
<div class="absolute inset-0 flex items-center justify-center pointer-events-none">
<div class="w-14 h-14 bg-white rounded-2xl flex items-center justify-center shadow-lg transform rotate-45 border border-primary/10">
<div class="transform -rotate-45 flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-3xl font-bold">blur_on</span>
</div>
</div>
</div>
</div>
</div>
<div class="mt-8 mb-4">
<span class="text-primary text-3xl font-extrabold tracking-[0.4em] uppercase glow-text">Spotbook</span>
</div>
<div class="text-center pb-4">
<h2 class="text-xl font-bold text-white tracking-tight">Spotbook Pro Name</h2>
<p class="text-primary/70 text-sm font-medium tracking-widest uppercase mt-1">@username</p>
</div>
</div>
</div>
<div class="w-full max-w-sm mt-12 grid grid-cols-2 gap-4">
<button class="flex flex-col items-center justify-center gap-2 art-glass hover:bg-white/5 transition-all py-6 rounded-3xl group">
<div class="w-12 h-12 rounded-full bg-primary/10 flex items-center justify-center text-primary group-active:scale-90 transition-transform">
<span class="material-symbols-outlined">download</span>
</div>
<span class="text-xs font-bold uppercase tracking-widest text-slate-400">Save HQ</span>
</button>
<button class="flex flex-col items-center justify-center gap-2 art-glass hover:bg-white/5 transition-all py-6 rounded-3xl group">
<div class="w-12 h-12 rounded-full bg-primary/10 flex items-center justify-center text-primary group-active:scale-90 transition-transform">
<span class="material-symbols-outlined">ios_share</span>
</div>
<span class="text-xs font-bold uppercase tracking-widest text-slate-400">Share</span>
</button>
</div>
</main>
<nav class="fixed bottom-6 left-6 right-6 art-glass rounded-full px-8 py-4 flex justify-between items-center z-50 shadow-2xl">
<a class="text-slate-500 hover:text-primary transition-colors" href="#">
<span class="material-symbols-outlined text-2xl">home</span>
</a>
<a class="text-slate-500 hover:text-primary transition-colors" href="#">
<span class="material-symbols-outlined text-2xl">search</span>
</a>
<a class="text-slate-500 hover:text-primary transition-colors" href="#">
<span class="material-symbols-outlined text-2xl">calendar_today</span>
</a>
<a class="text-slate-500 hover:text-primary transition-colors" href="#">
<span class="material-symbols-outlined text-2xl">chat_bubble</span>
</a>
<a class="text-primary" href="#">
<span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 1">account_circle</span>
</a>
</nav>

</body></html>
