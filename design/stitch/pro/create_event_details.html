<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Create Event: Event Details</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2badee",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101c22",
                        "surface-dark": "#233c48", // Extracted from provided snippets for consistency
                        "text-secondary": "#92b7c9", // Extracted from provided snippets
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "1rem", 
                        "lg": "1.5rem", 
                        "xl": "2rem", 
                        "2xl": "3rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-white antialiased selection:bg-primary/30">
<div class="relative flex h-full min-h-screen w-full flex-col overflow-x-hidden max-w-md mx-auto shadow-2xl">
<!-- TopAppBar -->
<header class="sticky top-0 z-10 flex items-center bg-background-light dark:bg-background-dark p-4 pb-2 justify-between border-b border-gray-200 dark:border-white/5 backdrop-blur-md bg-opacity-95 dark:bg-opacity-95">
<button class="text-slate-900 dark:text-white flex size-10 shrink-0 items-center justify-center rounded-full hover:bg-black/5 dark:hover:bg-white/10 transition-colors">
<span class="material-symbols-outlined">arrow_back_ios_new</span>
</button>
<h2 class="text-slate-900 dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center">Create Event</h2>
<button class="flex items-center justify-center rounded-full px-3 py-1 hover:bg-black/5 dark:hover:bg-white/10 transition-colors">
<p class="text-primary text-base font-bold leading-normal tracking-[0.015em] shrink-0">Cancel</p>
</button>
</header>
<!-- ProgressBar -->
<div class="flex flex-col gap-3 px-4 pt-2 pb-4 bg-background-light dark:bg-background-dark">
<div class="flex justify-between text-xs font-medium text-text-secondary mb-1">
<span>Step 1 of 4</span>
<span>20%</span>
</div>
<div class="rounded-full bg-slate-200 dark:bg-surface-dark h-2 overflow-hidden">
<div class="h-full rounded-full bg-primary transition-all duration-500 ease-out" style="width: 20%;"></div>
</div>
</div>
<!-- Scrollable Content -->
<main class="flex-1 flex flex-col px-4 pb-32">
<!-- HeadlineText -->
<div class="pt-2 pb-6">
<h1 class="text-slate-900 dark:text-white tracking-tight text-3xl font-bold leading-tight text-left mb-2">Let's start with the basics</h1>
<p class="text-slate-500 dark:text-text-secondary text-base font-normal leading-normal">Give your event a name and tell people what it's about.</p>
</div>
<form class="flex flex-col gap-6" onsubmit="event.preventDefault();">
<!-- Field: Event Title -->
<div class="flex flex-col gap-2">
<label class="text-slate-900 dark:text-white text-base font-medium leading-normal pl-1">Event Title <span class="text-primary">*</span></label>
<input class="form-input w-full rounded-xl border-transparent bg-white dark:bg-surface-dark text-slate-900 dark:text-white placeholder:text-slate-400 dark:placeholder:text-text-secondary focus:border-primary focus:ring-primary h-14 px-4 text-base shadow-sm ring-1 ring-slate-900/5 dark:ring-white/5" placeholder="e.g. Summer Jazz Workshop" type="text"/>
</div>
<!-- Field: Short Summary -->
<div class="flex flex-col gap-2">
<div class="flex justify-between items-end px-1">
<label class="text-slate-900 dark:text-white text-base font-medium leading-normal">Short Summary</label>
<span class="text-xs text-slate-400 dark:text-text-secondary">0/140</span>
</div>
<input class="form-input w-full rounded-xl border-transparent bg-white dark:bg-surface-dark text-slate-900 dark:text-white placeholder:text-slate-400 dark:placeholder:text-text-secondary focus:border-primary focus:ring-primary h-14 px-4 text-base shadow-sm ring-1 ring-slate-900/5 dark:ring-white/5" maxlength="140" placeholder="A catchy one-liner" type="text"/>
</div>
<!-- Field: Full Description -->
<div class="flex flex-col gap-2">
<label class="text-slate-900 dark:text-white text-base font-medium leading-normal pl-1">About this Event</label>
<textarea class="form-textarea w-full rounded-xl border-transparent bg-white dark:bg-surface-dark text-slate-900 dark:text-white placeholder:text-slate-400 dark:placeholder:text-text-secondary focus:border-primary focus:ring-primary min-h-[140px] p-4 text-base resize-none shadow-sm ring-1 ring-slate-900/5 dark:ring-white/5" placeholder="Describe the agenda, what attendees will learn, etc."></textarea>
</div>
<!-- Field: Category -->
<div class="flex flex-col gap-3">
<label class="text-slate-900 dark:text-white text-base font-medium leading-normal pl-1">Category</label>
<div class="flex overflow-x-auto pb-2 gap-3 no-scrollbar -mx-4 px-4 snap-x">
<!-- Selected Item -->
<button class="snap-start shrink-0 flex items-center gap-2 rounded-full bg-primary px-5 py-2.5 text-white shadow-md shadow-primary/25 transition-transform active:scale-95" type="button">
<span class="material-symbols-outlined text-[20px]">music_note</span>
<span class="text-sm font-semibold">Concert</span>
</button>
<!-- Unselected Items -->
<button class="snap-start shrink-0 flex items-center gap-2 rounded-full bg-white dark:bg-surface-dark border border-slate-200 dark:border-white/5 px-5 py-2.5 text-slate-600 dark:text-text-secondary hover:bg-slate-50 dark:hover:bg-white/5 transition-all active:scale-95" type="button">
<span class="material-symbols-outlined text-[20px]">palette</span>
<span class="text-sm font-medium">Arts</span>
</button>
<button class="snap-start shrink-0 flex items-center gap-2 rounded-full bg-white dark:bg-surface-dark border border-slate-200 dark:border-white/5 px-5 py-2.5 text-slate-600 dark:text-text-secondary hover:bg-slate-50 dark:hover:bg-white/5 transition-all active:scale-95" type="button">
<span class="material-symbols-outlined text-[20px]">school</span>
<span class="text-sm font-medium">Class</span>
</button>
<button class="snap-start shrink-0 flex items-center gap-2 rounded-full bg-white dark:bg-surface-dark border border-slate-200 dark:border-white/5 px-5 py-2.5 text-slate-600 dark:text-text-secondary hover:bg-slate-50 dark:hover:bg-white/5 transition-all active:scale-95" type="button">
<span class="material-symbols-outlined text-[20px]">fitness_center</span>
<span class="text-sm font-medium">Workshop</span>
</button>
<button class="snap-start shrink-0 flex items-center gap-2 rounded-full bg-white dark:bg-surface-dark border border-slate-200 dark:border-white/5 px-5 py-2.5 text-slate-600 dark:text-text-secondary hover:bg-slate-50 dark:hover:bg-white/5 transition-all active:scale-95" type="button">
<span class="material-symbols-outlined text-[20px]">restaurant</span>
<span class="text-sm font-medium">Food</span>
</button>
</div>
</div>
<!-- Field: Location Type -->
<div class="flex flex-col gap-3">
<label class="text-slate-900 dark:text-white text-base font-medium leading-normal pl-1">Location Type</label>
<div class="grid grid-cols-2 gap-4">
<!-- In Person Card (Selected) -->
<label class="cursor-pointer group relative">
<input checked="" class="peer sr-only" name="location_type" type="radio"/>
<div class="flex flex-col items-center justify-center gap-3 rounded-2xl bg-white dark:bg-surface-dark p-6 border-2 border-transparent peer-checked:border-primary peer-checked:bg-primary/5 transition-all shadow-sm">
<div class="rounded-full bg-slate-100 dark:bg-white/10 p-3 text-slate-500 dark:text-white peer-checked:bg-primary peer-checked:text-white transition-colors">
<span class="material-symbols-outlined text-2xl">location_on</span>
</div>
<span class="font-semibold text-slate-900 dark:text-white peer-checked:text-primary">In-Person</span>
</div>
<div class="absolute top-3 right-3 opacity-0 peer-checked:opacity-100 transition-opacity text-primary">
<span class="material-symbols-outlined filled text-[20px]">check_circle</span>
</div>
</label>
<!-- Online Card -->
<label class="cursor-pointer group relative">
<input class="peer sr-only" name="location_type" type="radio"/>
<div class="flex flex-col items-center justify-center gap-3 rounded-2xl bg-white dark:bg-surface-dark p-6 border-2 border-transparent border-slate-200 dark:border-transparent peer-checked:border-primary peer-checked:bg-primary/5 transition-all shadow-sm">
<div class="rounded-full bg-slate-100 dark:bg-white/10 p-3 text-slate-500 dark:text-white peer-checked:bg-primary peer-checked:text-white transition-colors">
<span class="material-symbols-outlined text-2xl">videocam</span>
</div>
<span class="font-semibold text-slate-900 dark:text-white peer-checked:text-primary">Online Event</span>
</div>
<div class="absolute top-3 right-3 opacity-0 peer-checked:opacity-100 transition-opacity text-primary">
<span class="material-symbols-outlined filled text-[20px]">check_circle</span>
</div>
</label>
</div>
</div>
</form>
</main>
<!-- Sticky Footer -->
<footer class="fixed bottom-0 left-0 right-0 z-20 bg-background-light dark:bg-background-dark border-t border-gray-200 dark:border-white/5 p-4 pb-6 backdrop-blur-xl bg-opacity-90 dark:bg-opacity-90 max-w-md mx-auto">
<button class="flex w-full items-center justify-center gap-2 rounded-full bg-primary px-6 py-4 transition-all hover:bg-opacity-90 active:scale-[0.98] shadow-lg shadow-primary/25 group">
<span class="text-white text-base font-bold leading-normal tracking-[0.015em]">Next: Date &amp; Time</span>
<span class="material-symbols-outlined text-white transition-transform group-hover:translate-x-1">arrow_forward</span>
</button>
</footer>
</div>
</body></html>
