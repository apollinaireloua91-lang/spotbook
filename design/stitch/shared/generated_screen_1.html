<!DOCTYPE html>

<html lang="fr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Spotbook - Confirmation d'annulation</title>
<!-- Tailwind CSS v3 CDN -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'dark-bg': '#080810',
            'brand-red': '#FF3B30',
            'card-bg': '#1C1C1E',
          }
        }
      }
    }
  </script>
<!-- BEGIN: Custom Styles -->
<style data-purpose="custom-transitions">
    .overlay-backdrop {
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
  </style>
<!-- END: Custom Styles -->
</head>
<body class="bg-dark-bg text-white font-sans antialiased min-h-screen flex flex-col justify-end">
<!-- BEGIN: Main Page Content (Background Context) -->
<main class="fixed inset-0 p-6 opacity-40 pointer-events-none" data-purpose="background-context">
<header class="mb-8">
<h1 class="text-2xl font-bold">Mes Billets</h1>
</header>
<div class="space-y-4">
<!-- Mock background ticket card -->
<div class="bg-card-bg p-4 rounded-2xl border border-gray-800">
<div class="flex justify-between items-start mb-4">
<div>
<h3 class="font-bold text-lg">Summer Jazz Festival</h3>
<p class="text-gray-400 text-sm">12 Octobre • 20:00</p>
</div>
<span class="bg-green-500/10 text-green-500 text-xs px-2 py-1 rounded">Confirmé</span>
</div>
</div>
</div>
</main>
<!-- END: Main Page Content -->
<!-- BEGIN: Cancellation Overlay -->
<div class="fixed inset-0 z-50 flex items-end justify-center overlay-backdrop bg-black/60" data-purpose="cancellation-modal-container">
<!-- Modal Sheet -->
<div class="bg-card-bg w-full rounded-t-[32px] p-6 pb-12 shadow-2xl border-t border-white/10" data-purpose="modal-sheet">
<!-- Pull Bar for Visual affordance -->
<div class="w-12 h-1.5 bg-gray-600 rounded-full mx-auto mb-8"></div>
<!-- Title Section -->
<section class="mb-6" data-purpose="modal-header">
<h2 class="text-2xl font-bold text-center">Annuler votre billet ?</h2>
</section>
<!-- Ticket Summary -->
<section class="bg-white/5 rounded-2xl p-4 mb-6 flex items-center gap-4" data-purpose="ticket-summary">
<div class="w-12 h-12 bg-brand-red/20 rounded-xl flex items-center justify-center">
<svg class="h-6 w-6 text-brand-red" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 012-2h10a2 2 0 012 2v14a2 2 0 01-2 2H7a2 2 0 01-2-2V5z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
<div>
<h4 class="font-semibold">Summer Jazz Festival</h4>
<p class="text-sm text-gray-400">12 Octobre 2024</p>
</div>
</section>
<!-- Warning and Refund Details -->
<section class="mb-8" data-purpose="warning-details">
<p class="text-gray-300 text-sm leading-relaxed mb-4">
          Cette action est irréversible. Selon les conditions du prestataire, un remboursement partiel de <span class="text-white font-semibold">80% ($20.00)</span> sera effectué sur votre carte <span class="text-white font-semibold">Visa •••• 4242</span>.
        </p>
</section>
<!-- Action Buttons -->
<div class="flex flex-col gap-3" data-purpose="modal-actions">
<!-- Main Confirmation Button -->
<button class="w-full bg-brand-red hover:bg-red-600 active:scale-[0.98] transition-all text-white font-bold py-4 rounded-2xl text-lg shadow-lg shadow-brand-red/20" data-purpose="confirm-button">
          Confirmer l'annulation
        </button>
<!-- Secondary Dismiss Button -->
<button class="w-full bg-transparent hover:bg-white/5 text-gray-400 font-semibold py-4 rounded-2xl transition-colors" data-purpose="cancel-button">
          Garder mon billet
        </button>
</div>
</div>
</div>
<!-- END: Cancellation Overlay -->
</body></html>
