<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Client Setup: Profile</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2badee",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101c22",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        body {
            min-height: max(800px, 100dvh);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-display bg-background-light dark:bg-background-dark text-slate-900 dark:text-white min-h-screen flex flex-col antialiased">
<div class="sticky top-0 z-10 bg-background-light/95 dark:bg-background-dark/95 backdrop-blur-sm px-4 pt-12 pb-2 flex items-center justify-between">
<div class="w-10"></div>
<div class="w-10"></div>
</div>
<main class="flex-1 px-5 pb-8 flex flex-col max-w-md mx-auto w-full">
<div class="mb-6 flex flex-col items-center text-center animate-pulse">
<div class="w-16 h-16 bg-green-100 dark:bg-green-900/30 rounded-full flex items-center justify-center mb-3 text-green-600 dark:text-green-400">
<span class="material-symbols-outlined text-3xl">check</span>
</div>
<h2 class="text-lg font-semibold text-green-600 dark:text-green-400">Account Created!</h2>
</div>
<div class="mb-8 text-center">
<h1 class="text-3xl font-bold tracking-tight mb-2">Complete your profile</h1>
<p class="text-slate-500 dark:text-slate-400 text-base">Add a photo and bio so providers know who they're working with.</p>
</div>
<form action="#" class="space-y-6 flex-1 flex flex-col" method="POST">
<div class="flex flex-col items-center justify-center mb-2">
<div class="relative group cursor-pointer">
<div class="w-32 h-32 rounded-full bg-slate-200 dark:bg-[#192b33] flex items-center justify-center overflow-hidden border-4 border-white dark:border-background-dark shadow-xl">
<span class="material-symbols-outlined text-5xl text-slate-400">person</span>
</div>
<button class="absolute bottom-1 right-1 bg-primary text-white p-2.5 rounded-full shadow-lg hover:bg-blue-600 transition-transform active:scale-95 flex items-center justify-center border-2 border-white dark:border-background-dark" type="button">
<span class="material-symbols-outlined text-xl leading-none">photo_camera</span>
</button>
</div>
<button class="mt-4 text-primary font-semibold text-sm hover:text-blue-500" type="button">
                    Upload Photo
                </button>
</div>
<div class="space-y-1.5">
<label class="block text-sm font-medium ml-1 text-slate-700 dark:text-slate-300" for="fullname">Display Name</label>
<div class="relative">
<input class="w-full bg-slate-50 dark:bg-[#192b33] border-transparent focus:border-primary focus:ring-0 rounded-full h-12 px-4 placeholder:text-slate-400 dark:placeholder:text-slate-500 text-base transition-colors duration-200" id="fullname" type="text" value="Jane Doe"/>
<span class="material-symbols-outlined absolute right-4 top-3 text-slate-400 text-xl pointer-events-none">edit</span>
</div>
</div>
<div class="space-y-1.5 flex-1">
<label class="block text-sm font-medium ml-1 text-slate-700 dark:text-slate-300 flex justify-between" for="bio">
<span>Bio</span>
<span class="text-slate-400 font-normal text-xs uppercase tracking-wide mt-0.5">Optional</span>
</label>
<div class="relative h-full">
<textarea class="w-full bg-slate-50 dark:bg-[#192b33] border-transparent focus:border-primary focus:ring-0 rounded-3xl p-4 placeholder:text-slate-400 dark:placeholder:text-slate-500 text-base transition-colors duration-200 resize-none h-40" id="bio" placeholder="Tell us a little about yourself..."></textarea>
</div>
</div>
<div class="flex-1"></div>
<div class="space-y-3 pt-4">
<button class="w-full h-14 bg-primary hover:bg-blue-500 active:scale-[0.98] transition-all rounded-full flex items-center justify-center shadow-[0_4px_14px_0_rgba(43,173,238,0.39)]" type="submit">
<span class="text-white text-base font-bold tracking-wide">Save Profile</span>
</button>
<button class="w-full h-12 bg-transparent hover:bg-slate-100 dark:hover:bg-white/5 active:scale-[0.98] transition-all rounded-full flex items-center justify-center" type="button">
<span class="text-slate-500 dark:text-slate-400 text-sm font-semibold">Skip for now</span>
</button>
</div>
</form>
</main>
<div class="fixed top-0 right-0 -z-10 w-[300px] h-[300px] bg-primary/20 blur-[100px] rounded-full translate-x-1/2 -translate-y-1/2 pointer-events-none"></div>
<div class="fixed bottom-0 left-0 -z-10 w-[200px] h-[200px] bg-blue-500/10 blur-[80px] rounded-full -translate-x-1/2 translate-y-1/2 pointer-events-none"></div>

</body></html>
