<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Provider Setup: Business Details</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2badee",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101c22",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        body {
            min-height: max(884px, 100dvh);
        }::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-display bg-background-light dark:bg-background-dark text-slate-900 dark:text-white min-h-screen flex flex-col antialiased">
<div class="sticky top-0 z-10 bg-background-light/95 dark:bg-background-dark/95 backdrop-blur-sm px-4 pt-12 pb-2 flex items-center justify-between">
<button class="flex items-center justify-center p-2 -ml-2 rounded-full hover:bg-black/5 dark:hover:bg-white/10 transition-colors text-slate-900 dark:text-white">
<span class="material-symbols-outlined text-2xl">arrow_back_ios_new</span>
</button>
<div class="flex gap-1.5">
<div class="w-8 h-1.5 rounded-full bg-primary"></div>
<div class="w-2 h-1.5 rounded-full bg-slate-300 dark:bg-slate-700"></div>
<div class="w-2 h-1.5 rounded-full bg-slate-300 dark:bg-slate-700"></div>
</div>
<div class="w-10"></div> 
</div>
<main class="flex-1 px-5 pb-8 flex flex-col max-w-md mx-auto w-full">
<div class="mt-2 mb-4">
<div class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-blue-100 dark:bg-blue-500/10 border border-blue-200 dark:border-blue-500/20">
<span class="relative flex h-2 w-2">
<span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-primary opacity-75"></span>
<span class="relative inline-flex rounded-full h-2 w-2 bg-primary"></span>
</span>
<span class="text-xs font-semibold text-primary tracking-wide uppercase">Setup in progress</span>
</div>
</div>
<div class="mb-8">
<h1 class="text-3xl font-bold tracking-tight mb-3">Business Details</h1>
<p class="text-slate-500 dark:text-slate-400 text-base leading-relaxed">
                Step 1: Tell us about your professional services so clients can discover you easily.
            </p>
</div>
<form action="#" class="space-y-6 flex-1" method="POST">
<div class="space-y-1.5">
<label class="block text-sm font-medium ml-1 text-slate-700 dark:text-slate-300" for="business_name">Business Name</label>
<div class="relative group">
<input class="w-full bg-slate-50 dark:bg-[#192b33] border-transparent focus:border-primary focus:ring-0 rounded-full h-14 px-5 placeholder:text-slate-400 dark:placeholder:text-slate-500 text-base transition-colors duration-200" id="business_name" placeholder="e.g., Luxe Hair Studio" required="" type="text"/>
<span class="material-symbols-outlined absolute right-5 top-4 text-slate-400 text-xl pointer-events-none group-focus-within:text-primary transition-colors">storefront</span>
</div>
</div>
<div class="space-y-1.5">
<label class="block text-sm font-medium ml-1 text-slate-700 dark:text-slate-300" for="category">Service Category</label>
<div class="relative group">
<select class="w-full bg-slate-50 dark:bg-[#192b33] border-transparent focus:border-primary focus:ring-0 rounded-full h-14 px-5 pr-12 text-base text-slate-900 dark:text-white appearance-none transition-colors duration-200 cursor-pointer" id="category" required="">
<option class="text-slate-400" disabled="" selected="" value="">Select your main category</option>
<option value="hair">Hair Styling</option>
<option value="makeup">Makeup Artistry</option>
<option value="events">Event Planning</option>
<option value="photo">Photography</option>
<option value="wellness">Wellness &amp; Spa</option>
</select>
<span class="material-symbols-outlined absolute right-5 top-4 text-slate-400 text-xl pointer-events-none group-focus-within:text-primary transition-colors">category</span>
</div>
</div>
<div class="space-y-1.5">
<label class="block text-sm font-medium ml-1 text-slate-700 dark:text-slate-300" for="location">City / Location</label>
<div class="relative group">
<input class="w-full bg-slate-50 dark:bg-[#192b33] border-transparent focus:border-primary focus:ring-0 rounded-full h-14 px-5 placeholder:text-slate-400 dark:placeholder:text-slate-500 text-base transition-colors duration-200" id="location" placeholder="e.g., Los Angeles, CA" required="" type="text"/>
<span class="material-symbols-outlined absolute right-5 top-4 text-slate-400 text-xl pointer-events-none group-focus-within:text-primary transition-colors">location_on</span>
</div>
</div>
<div class="space-y-1.5">
<label class="block text-sm font-medium ml-1 text-slate-700 dark:text-slate-300" for="bio">Professional Bio</label>
<div class="relative group">
<textarea class="w-full bg-slate-50 dark:bg-[#192b33] border-transparent focus:border-primary focus:ring-0 rounded-[2rem] py-4 px-5 placeholder:text-slate-400 dark:placeholder:text-slate-500 text-base transition-colors duration-200 resize-none min-h-[140px]" id="bio" placeholder="Briefly describe your experience and what makes your services unique..." required=""></textarea>
<span class="material-symbols-outlined absolute right-5 top-4 text-slate-400 text-xl pointer-events-none group-focus-within:text-primary transition-colors">edit_note</span>
</div>
<p class="text-xs text-slate-400 text-right pr-2">0/300 characters</p>
</div>
<div class="flex-1"></div>
<div class="pt-4 pb-6">
<button class="w-full h-14 bg-primary hover:bg-blue-500 active:scale-[0.98] transition-all rounded-full flex items-center justify-center shadow-[0_4px_14px_0_rgba(43,173,238,0.39)] group" type="submit">
<span class="text-white text-base font-bold tracking-wide mr-2">Continue</span>
<span class="material-symbols-outlined text-white text-lg group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</div>
</form>
</main>
<div class="fixed top-0 right-0 -z-10 w-[300px] h-[300px] bg-primary/20 blur-[100px] rounded-full translate-x-1/2 -translate-y-1/2 pointer-events-none"></div>
<div class="fixed bottom-0 left-0 -z-10 w-[200px] h-[200px] bg-blue-500/10 blur-[80px] rounded-full -translate-x-1/2 translate-y-1/2 pointer-events-none"></div>

</body></html>
