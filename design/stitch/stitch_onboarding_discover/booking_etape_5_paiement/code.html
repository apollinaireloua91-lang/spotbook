<!DOCTYPE html>

<html class="dark" lang="fr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              colors: {
                "primary": "#2badee",
                "background-light": "#f6f7f8",
                "background-dark": "#080810",
              },
              fontFamily: {
                "display": ["Plus Jakarta Sans"]
              },
              borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
            },
          },
        }
      </script>
<style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen flex items-center justify-center p-4">
<!-- Booking Bottom Sheet Container -->
<div class="relative flex h-auto max-w-md w-full flex-col bg-background-light dark:bg-background-dark overflow-hidden rounded-xl shadow-2xl border border-primary/10">
<!-- Bottom Sheet Handle Overlay Simulation -->
<div class="flex flex-col items-stretch">
<!-- Drag Handle -->
<button class="flex h-6 w-full items-center justify-center group">
<div class="h-1.5 w-12 rounded-full bg-slate-300 dark:bg-slate-700 group-hover:bg-primary transition-colors"></div>
</button>
<!-- Progress Header -->
<div class="flex flex-col gap-3 px-6 py-4">
<div class="flex gap-6 justify-between items-end">
<div>
<p class="text-slate-500 dark:text-slate-400 text-xs font-semibold uppercase tracking-wider">Étape 5 sur 6</p>
<h2 class="text-slate-900 dark:text-slate-100 text-2xl font-bold leading-tight mt-1">Paiement sécurisé</h2>
</div>
<p class="text-primary text-sm font-bold leading-normal">83%</p>
</div>
<div class="h-2 rounded-full bg-slate-200 dark:bg-slate-800 overflow-hidden">
<div class="h-full rounded-full bg-primary" style="width: 83.3%;"></div>
</div>
</div>
<!-- Content -->
<div class="flex-1 px-6 py-4">
<!-- Order Summary Mini Card -->
<div class="mb-6 p-4 rounded-xl bg-slate-100 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-800 flex justify-between items-center">
<div>
<p class="text-slate-500 dark:text-slate-400 text-xs font-medium">Total à régler</p>
<p class="text-slate-900 dark:text-slate-100 text-2xl font-extrabold">$60.00</p>
</div>
<div class="flex items-center gap-2 text-primary">
<span class="material-symbols-outlined text-lg">verified_user</span>
<span class="text-[10px] font-bold uppercase tracking-widest">Secured by Stripe</span>
</div>
</div>
<!-- Card Details Form -->
<div class="space-y-4">
<!-- Card Number -->
<label class="flex flex-col gap-2">
<span class="text-slate-700 dark:text-slate-300 text-sm font-semibold ml-1">Numéro de carte</span>
<div class="flex w-full items-stretch rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 focus-within:border-primary focus-within:ring-1 focus-within:ring-primary transition-all">
<input class="flex-1 bg-transparent border-none focus:ring-0 text-slate-900 dark:text-slate-100 placeholder:text-slate-400 dark:placeholder:text-slate-600 h-14 px-4 text-base font-medium" placeholder="0000 0000 0000 0000" type="text"/>
<div class="flex items-center px-4 text-slate-400 dark:text-slate-500">
<span class="material-symbols-outlined">credit_card</span>
</div>
</div>
</label>
<div class="grid grid-cols-2 gap-4">
<!-- Expiry -->
<label class="flex flex-col gap-2">
<span class="text-slate-700 dark:text-slate-300 text-sm font-semibold ml-1">Date d'expiration</span>
<input class="w-full rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 focus:border-primary focus:ring-1 focus:ring-primary text-slate-900 dark:text-slate-100 placeholder:text-slate-400 dark:placeholder:text-slate-600 h-14 px-4 text-base font-medium transition-all" placeholder="MM / YY" type="text"/>
</label>
<!-- CVC -->
<label class="flex flex-col gap-2">
<span class="text-slate-700 dark:text-slate-300 text-sm font-semibold ml-1">CVC / CVV</span>
<div class="relative">
<input class="w-full rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 focus:border-primary focus:ring-1 focus:ring-primary text-slate-900 dark:text-slate-100 placeholder:text-slate-400 dark:placeholder:text-slate-600 h-14 px-4 text-base font-medium transition-all" placeholder="123" type="password"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 dark:text-slate-500 text-xl">help</span>
</div>
</label>
</div>
</div>
<!-- Footer / Navigation -->
<div class="mt-10 flex flex-col gap-3">
<button class="w-full h-14 bg-primary hover:opacity-90 text-white font-bold text-lg rounded-xl flex items-center justify-center gap-2 transition-transform active:scale-[0.98]">
<span class="material-symbols-outlined">lock</span>
                        Payer $60.00
                    </button>
<div class="flex gap-3">
<button class="flex-1 h-12 bg-slate-100 dark:bg-slate-900 text-slate-600 dark:text-slate-400 font-semibold rounded-xl border border-slate-200 dark:border-slate-800 flex items-center justify-center gap-2 hover:bg-slate-200 dark:hover:bg-slate-800 transition-colors">
<span class="material-symbols-outlined text-xl">chevron_left</span>
                            Retour
                        </button>
</div>
</div>
<!-- Security Disclaimer -->
<p class="mt-6 text-center text-[11px] text-slate-500 dark:text-slate-500 leading-relaxed max-w-[280px] mx-auto">
                    Vos données de paiement sont cryptées de bout en bout. Nous ne stockons jamais votre numéro de carte complet.
                </p>
</div>
</div>
<!-- Spacer for mobile reachability -->
<div class="h-6 bg-background-light dark:bg-background-dark"></div>
</div>
</body></html>
