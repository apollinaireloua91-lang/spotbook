</div>
<!-- Description -->
<p class="text-sm text-white/90 line-clamp-2 drop-shadow-sm font-medium leading-snug">
                Summer fades are in! 💇‍♂️ Check out this transformation. Slots open for next week! 🔥 <span class="font-bold text-white">#barber #fade #style</span>

<button class="flex flex-col items-center justify-center gap-1 w-14 text-white/40 hover:text-white transition-colors relative">
<span class="material-symbols-outlined text-[26px]">confirmation_number</span>
