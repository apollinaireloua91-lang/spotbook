<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#00D4FF",
                        "background-light": "#f6f7f8",
                        "background-dark": "#080810",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans"]
                    },
                    borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 antialiased">
<!-- Main Container representing a mobile screen or focused view -->
<div class="relative mx-auto max-w-md min-h-screen bg-background-dark overflow-hidden flex flex-col">
<!-- Video Feed Background (MediaPlayer Component Context) -->
<div class="relative flex-1 flex flex-col bg-slate-900 overflow-hidden">
<div class="absolute inset-0 bg-cover bg-center opacity-60" data-alt="Fitness trainer performing a high intensity workout" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuB1K_tEAxpIbJdWSP10RFouYJdTH7NiXGWORLEc7TiBHmWdOOznkWdh3ekS7sy4taoj_Y8UXQuagTuWPCr2SoPuv3wi5mkWH2Q2ESL2EdyRUsysolO0SC0mvgfbae8cBSvCveoL0mH5x-KqZSCwnDAFm_ICIyufBJlW0xHSqSAzIbQx8wbYiNtcAvU_Ll-1rcb8rjDRzj0DdkM4U1mciWyTBZoQWgWp6CjQgwLw-ksTCTtxty5fnxL6RYIFxVzzPgTPJhvJhW9XGTk");'></div>
<!-- Video Overlay Controls -->
<div class="relative z-10 flex flex-col h-full">
<div class="p-6 flex justify-between items-start">
<button class="bg-black/40 backdrop-blur-md p-2 rounded-full text-white">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<div class="bg-black/40 backdrop-blur-md px-4 py-2 rounded-full text-white text-sm font-medium">
                        Live Session
                    </div>
</div>
<div class="mt-auto mb-64 flex justify-center">
<button class="flex shrink-0 items-center justify-center rounded-full size-20 bg-primary/20 backdrop-blur-xl text-primary border border-primary/30">
<span class="material-symbols-outlined text-4xl" style="font-variation-settings: 'FILL' 1">play_arrow</span>
</button>
</div>
</div>
</div>
<!-- Booking Bottom Sheet -->
<div class="absolute inset-0 bg-black/60 flex flex-col justify-end">
<div class="bg-background-dark border-t border-slate-800 rounded-t-lg shadow-2xl flex flex-col">
<!-- Pull Handle -->
<div class="flex h-6 w-full items-center justify-center">
<div class="h-1.5 w-12 rounded-full bg-slate-700"></div>
</div>
<!-- Step & Progress Header -->
<div class="px-6 py-4">
<div class="flex items-center justify-between mb-3">
<h2 class="text-slate-100 text-lg font-bold">Select Date</h2>
<span class="text-primary text-sm font-semibold">Step 2 of 6</span>
</div>
<!-- Progress Bar -->
<div class="h-1.5 w-full bg-slate-800 rounded-full overflow-hidden">
<div class="h-full bg-primary rounded-full transition-all duration-500" style="width: 33.33%;"></div>
</div>
</div>
<!-- Date Selection Area -->
<div class="flex flex-col gap-4 py-4">
<div class="px-6 flex justify-between items-center">
<p class="text-slate-400 text-sm font-medium uppercase tracking-wider">October 2023</p>
<span class="material-symbols-outlined text-slate-400 text-xl">calendar_month</span>
</div>
<!-- Horizontal Scrollable Calendar -->
<div class="flex gap-4 px-6 overflow-x-auto no-scrollbar pb-2">
<!-- Previous/Past Day -->
<div class="flex flex-col items-center justify-center min-w-[64px] h-24 rounded-2xl bg-slate-900/50 border border-slate-800 opacity-40">
<span class="text-[10px] font-bold text-slate-500 mb-1">SUN</span>
<span class="text-xl font-bold text-slate-400">11</span>
</div>
<!-- Selected Day -->
<div class="flex flex-col items-center justify-center min-w-[64px] h-24 rounded-2xl bg-primary shadow-[0_0_20px_rgba(0,212,255,0.3)]">
<span class="text-[10px] font-bold text-background-dark mb-1">MON</span>
<span class="text-xl font-bold text-background-dark">12</span>
<div class="mt-1 w-1.5 h-1.5 rounded-full bg-background-dark"></div>
</div>
<!-- Upcoming Days -->
<div class="flex flex-col items-center justify-center min-w-[64px] h-24 rounded-2xl bg-slate-900 border border-slate-800">
<span class="text-[10px] font-bold text-slate-500 mb-1">TUE</span>
<span class="text-xl font-bold text-slate-100">13</span>
</div>
<div class="flex flex-col items-center justify-center min-w-[64px] h-24 rounded-2xl bg-slate-900 border border-slate-800">
<span class="text-[10px] font-bold text-slate-500 mb-1">WED</span>
<span class="text-xl font-bold text-slate-100">14</span>
</div>
<div class="flex flex-col items-center justify-center min-w-[64px] h-24 rounded-2xl bg-slate-900 border border-slate-800">
<span class="text-[10px] font-bold text-slate-500 mb-1">THU</span>
<span class="text-xl font-bold text-slate-100">15</span>
</div>
<div class="flex flex-col items-center justify-center min-w-[64px] h-24 rounded-2xl bg-slate-900 border border-slate-800">
<span class="text-[10px] font-bold text-slate-500 mb-1">FRI</span>
<span class="text-xl font-bold text-slate-100">16</span>
</div>
<div class="flex flex-col items-center justify-center min-w-[64px] h-24 rounded-2xl bg-slate-900 border border-slate-800">
<span class="text-[10px] font-bold text-slate-500 mb-1">SAT</span>
<span class="text-xl font-bold text-slate-100">17</span>
</div>
<div class="flex flex-col items-center justify-center min-w-[64px] h-24 rounded-2xl bg-slate-900 border border-slate-800">
<span class="text-[10px] font-bold text-slate-500 mb-1">SUN</span>
<span class="text-xl font-bold text-slate-100">18</span>
</div>
</div>
</div>
<!-- Availability Notice -->
<div class="px-6 py-2">
<div class="bg-primary/5 rounded-xl p-4 border border-primary/10 flex gap-3 items-center">
<span class="material-symbols-outlined text-primary">info</span>
<p class="text-xs text-slate-300 leading-relaxed">
<span class="text-primary font-bold uppercase text-[10px] block mb-0.5">Note</span>
                            Slots are available from 8:00 AM to 9:00 PM for the selected date.
                        </p>
</div>
</div>
<!-- Navigation Footer -->
<div class="p-6 flex gap-4 mt-2">
<button class="flex-1 flex items-center justify-center gap-2 h-14 rounded-xl border border-slate-800 bg-slate-900/50 text-slate-300 font-bold hover:bg-slate-800 transition-colors">
<span class="material-symbols-outlined text-xl">arrow_back</span>
                        Back
                    </button>
<button class="flex-[2] flex items-center justify-center gap-2 h-14 rounded-xl bg-primary text-background-dark font-bold shadow-lg shadow-primary/20 hover:opacity-90 transition-opacity">
                        Next Step
                        <span class="material-symbols-outlined text-xl">arrow_forward</span>
</button>
</div>
<!-- Safe Area Padding for mobile -->
<div class="h-8 bg-background-dark"></div>
</div>
</div>
</div>
</body></html>
