<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sign Up: Service Provider</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2badee",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101c22",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-display bg-background-light dark:bg-background-dark text-slate-900 dark:text-white min-h-screen flex flex-col antialiased">
<div class="sticky top-0 z-10 bg-background-light/95 dark:bg-background-dark/95 backdrop-blur-sm px-4 pt-12 pb-2 flex items-center justify-between">
<button class="flex items-center justify-center p-2 -ml-2 rounded-full hover:bg-black/5 dark:hover:bg-white/10 transition-colors">
<span class="material-symbols-outlined text-2xl">arrow_back_ios_new</span>
</button>
<div class="w-10"></div>
</div>
<main class="flex-1 px-5 pb-8 flex flex-col max-w-md mx-auto w-full">
<div class="mb-6">
<h1 class="text-3xl font-bold tracking-tight mb-2">Create your account</h1>
<p class="text-slate-500 dark:text-slate-400 text-base">Join the community to discover, book, and experience events.</p>
</div>
<div class="mb-8">
<div class="bg-slate-200 dark:bg-[#192b33] p-1 rounded-full flex relative">
<label class="flex-1 relative cursor-pointer group z-10">
<input class="peer sr-only" name="role" type="radio" value="client"/>
<div class="h-10 flex items-center justify-center rounded-full transition-all duration-300 peer-checked:bg-background-light dark:peer-checked:bg-background-dark peer-checked:shadow-sm">
<span class="text-sm font-semibold text-slate-500 dark:text-slate-400 peer-checked:text-slate-900 dark:peer-checked:text-white group-hover:text-slate-700 dark:group-hover:text-slate-200">Client</span>
</div>
</label>
<label class="flex-1 relative cursor-pointer group z-10">
<input checked="" class="peer sr-only" name="role" type="radio" value="provider"/>
<div class="h-10 flex items-center justify-center rounded-full transition-all duration-300 peer-checked:bg-background-light dark:peer-checked:bg-background-dark peer-checked:shadow-sm">
<span class="text-sm font-semibold text-slate-500 dark:text-slate-400 peer-checked:text-slate-900 dark:peer-checked:text-white group-hover:text-slate-700 dark:group-hover:text-slate-200">Service Provider</span>
</div>
</label>
</div>
</div>
<form action="#" class="space-y-5 flex-1" method="POST">
<div class="space-y-1.5">
<label class="block text-sm font-medium ml-1" for="fullname">Full Name</label>
<div class="relative">
<input class="w-full bg-slate-50 dark:bg-[#192b33] border-transparent focus:border-primary focus:ring-0 rounded-full h-12 px-4 placeholder:text-slate-400 dark:placeholder:text-slate-500 text-base transition-colors duration-200" id="fullname" placeholder="Jane Doe" required="" type="text"/>
<span class="material-symbols-outlined absolute right-4 top-3 text-slate-400 text-xl pointer-events-none">person</span>
</div>
</div>
<div class="space-y-1.5">
<label class="block text-sm font-medium ml-1" for="email">Email Address</label>
<div class="relative">
<input class="w-full bg-slate-50 dark:bg-[#192b33] border-transparent focus:border-primary focus:ring-0 rounded-full h-12 px-4 placeholder:text-slate-400 dark:placeholder:text-slate-500 text-base transition-colors duration-200" id="email" placeholder="name@example.com" required="" type="email"/>
<span class="material-symbols-outlined absolute right-4 top-3 text-slate-400 text-xl pointer-events-none">mail</span>
</div>
</div>
<div class="space-y-1.5">
<label class="block text-sm font-medium ml-1" for="phone">Phone Number</label>
<div class="relative">
<input class="w-full bg-slate-50 dark:bg-[#192b33] border-transparent focus:border-primary focus:ring-0 rounded-full h-12 px-4 placeholder:text-slate-400 dark:placeholder:text-slate-500 text-base transition-colors duration-200" id="phone" placeholder="+1 (555) 000-0000" required="" type="tel"/>
<span class="material-symbols-outlined absolute right-4 top-3 text-slate-400 text-xl pointer-events-none">call</span>
</div>
</div>
<div class="grid grid-cols-3 gap-4">
<div class="col-span-1 space-y-1.5">
<label class="block text-sm font-medium ml-1" for="age">Age</label>
<input class="w-full bg-slate-50 dark:bg-[#192b33] border-transparent focus:border-primary focus:ring-0 rounded-full h-12 px-4 placeholder:text-slate-400 dark:placeholder:text-slate-500 text-base text-center transition-colors duration-200" id="age" placeholder="18+" required="" type="number"/>
</div>
<div class="col-span-2 space-y-1.5">
<label class="block text-sm font-medium ml-1" for="address">Address</label>
<div class="relative">
<input class="w-full bg-slate-50 dark:bg-[#192b33] border-transparent focus:border-primary focus:ring-0 rounded-full h-12 px-4 pr-10 placeholder:text-slate-400 dark:placeholder:text-slate-500 text-base truncate transition-colors duration-200" id="address" placeholder="Street, City" required="" type="text"/>
<span class="material-symbols-outlined absolute right-4 top-3 text-slate-400 text-xl pointer-events-none">location_on</span>
</div>
</div>
</div>
<div class="space-y-1.5">
<label class="block text-sm font-medium ml-1" for="password">Password</label>
<div class="relative group/pass">
<input class="w-full bg-slate-50 dark:bg-[#192b33] border-transparent focus:border-primary focus:ring-0 rounded-full h-12 px-4 placeholder:text-slate-400 dark:placeholder:text-slate-500 text-base transition-colors duration-200" id="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-4 top-3 text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 focus:outline-none" type="button">
<span class="material-symbols-outlined text-xl">visibility_off</span>
</button>
</div>
</div>
<div class="pt-2 px-1">
<p class="text-xs text-slate-500 dark:text-slate-400 text-center leading-relaxed">
                    By selecting "Create Account", you agree to our 
                    <a class="text-primary hover:underline" href="#">Terms of Service</a> and 
                    <a class="text-primary hover:underline" href="#">Privacy Policy</a>.
                </p>
</div>
<div class="pt-4">
<button class="w-full h-14 bg-primary hover:bg-blue-500 active:scale-[0.98] transition-all rounded-full flex items-center justify-center shadow-[0_4px_14px_0_rgba(43,173,238,0.39)]" type="submit">
<span class="text-white text-base font-bold tracking-wide">Create Account</span>
</button>
</div>
<div class="text-center pt-2 pb-6">
<p class="text-sm text-slate-600 dark:text-slate-400">
                    Already have an account? <a class="text-primary font-semibold hover:underline" href="#">Log in</a>
</p>
</div>
</form>
</main>
<div class="fixed top-0 right-0 -z-10 w-[300px] h-[300px] bg-primary/20 blur-[100px] rounded-full translate-x-1/2 -translate-y-1/2 pointer-events-none"></div>
</body></html>
