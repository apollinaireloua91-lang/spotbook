<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&amp;family=Noto+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2badee",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101c22",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"],
                        "body": ["Noto Sans", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        /* Custom scrollbar hide for cleaner mobile look */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display antialiased text-slate-900 dark:text-white">
<div class="relative flex h-full min-h-screen w-full flex-col overflow-x-hidden max-w-md mx-auto">
<!-- Header/Logo Area -->
<div class="flex flex-col items-center pt-12 pb-6 px-4">
<div class="h-20 w-20 bg-primary/20 rounded-xl flex items-center justify-center mb-6 backdrop-blur-sm">
<span class="material-symbols-outlined text-primary text-4xl">play_circle</span>
</div>
<h1 class="text-slate-900 dark:text-white tracking-tight text-[32px] font-bold leading-tight text-center">Welcome Back</h1>
<p class="text-slate-500 dark:text-[#92b7c9] text-base font-normal leading-normal pt-2 text-center">Login to your account to continue</p>
</div>
<!-- Role Toggle (SegmentedButtons) -->
<div class="flex px-4 py-2 w-full">
<div class="flex h-12 flex-1 items-center justify-center rounded-full bg-slate-200 dark:bg-[#233c48] p-1">
<label class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-full px-2 has-[:checked]:bg-white dark:has-[:checked]:bg-[#111c22] has-[:checked]:shadow-sm has-[:checked]:text-primary text-slate-500 dark:text-[#92b7c9] text-sm font-medium leading-normal transition-all duration-200">
<span class="truncate">Client</span>
<input checked="" class="invisible w-0 absolute" name="role-selector" type="radio" value="Client"/>
</label>
<label class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-full px-2 has-[:checked]:bg-white dark:has-[:checked]:bg-[#111c22] has-[:checked]:shadow-sm has-[:checked]:text-primary text-slate-500 dark:text-[#92b7c9] text-sm font-medium leading-normal transition-all duration-200">
<span class="truncate">Service Provider</span>
<input class="invisible w-0 absolute" name="role-selector" type="radio" value="Service Provider"/>
</label>
</div>
</div>
<!-- Form Fields -->
<div class="flex flex-col gap-4 px-4 py-6 w-full">
<!-- Email Field -->
<label class="flex flex-col w-full">
<div class="relative flex w-full items-center">
<div class="absolute left-4 text-slate-400 dark:text-[#92b7c9]">
<span class="material-symbols-outlined text-[20px]">mail</span>
</div>
<input class="form-input flex w-full min-w-0 resize-none overflow-hidden rounded-full text-slate-900 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border-none bg-slate-200 dark:bg-[#233c48] h-14 placeholder:text-slate-400 dark:placeholder:text-[#92b7c9] pl-12 pr-4 text-base font-normal leading-normal transition-colors" placeholder="Email Address" type="email" value=""/>
</div>
</label>
<!-- Password Field -->
<label class="flex flex-col w-full">
<div class="relative flex w-full items-center">
<div class="absolute left-4 text-slate-400 dark:text-[#92b7c9]">
<span class="material-symbols-outlined text-[20px]">lock</span>
</div>
<input class="form-input flex w-full min-w-0 resize-none overflow-hidden rounded-full text-slate-900 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border-none bg-slate-200 dark:bg-[#233c48] h-14 placeholder:text-slate-400 dark:placeholder:text-[#92b7c9] pl-12 pr-12 text-base font-normal leading-normal transition-colors" placeholder="Password" type="password" value=""/>
<button class="absolute right-4 text-slate-400 dark:text-[#92b7c9] focus:outline-none hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</label>
<!-- Forgot Password Link -->
<div class="flex justify-end px-2">
<a class="text-sm font-medium text-slate-500 hover:text-primary dark:text-[#92b7c9] dark:hover:text-primary transition-colors" href="#">Forgot Password?</a>
</div>
<!-- Login Button -->
<button class="w-full h-14 mt-4 rounded-full bg-primary hover:bg-primary/90 text-white text-base font-bold shadow-lg shadow-primary/20 transition-all active:scale-[0.98] flex items-center justify-center gap-2">
<span>Login</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
<!-- Social Login Separator (Optional but good for modern apps) -->
<div class="flex items-center gap-4 px-8 py-4">
<div class="h-px flex-1 bg-slate-200 dark:bg-[#233c48]"></div>
<span class="text-xs text-slate-400 dark:text-[#92b7c9] font-medium uppercase">Or continue with</span>
<div class="h-px flex-1 bg-slate-200 dark:bg-[#233c48]"></div>
</div>
<!-- Social Buttons -->
<div class="flex justify-center gap-4 px-4 pb-8">
<button class="h-12 w-12 rounded-full bg-slate-200 dark:bg-[#233c48] flex items-center justify-center hover:bg-slate-300 dark:hover:bg-[#2f4b5a] transition-colors">
<!-- Google Icon placeholder logic -->
<svg class="w-5 h-5" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M23.766 12.2764C23.766 11.4607 23.6999 10.6406 23.5588 9.83807H12.24V14.4591H18.7217C18.4528 15.9494 17.5885 17.2678 16.323 18.1056V21.1039H20.19C22.4608 19.0139 23.766 15.9274 23.766 12.2764Z" fill="#4285F4"></path><path d="M12.24 24.0008C15.4765 24.0008 18.2058 22.9382 20.19 21.1039L16.323 18.1056C15.2498 18.8375 13.8627 19.252 12.2445 19.252C9.11388 19.252 6.45946 17.1399 5.50705 14.3003H1.5166V17.3912C3.55371 21.4434 7.7029 24.0008 12.24 24.0008Z" fill="#34A853"></path><path d="M5.50253 14.3003C4.99987 12.8099 4.99987 11.1961 5.50253 9.70575V6.61481H1.5166C-0.18551 10.0056 -0.18551 14.0004 1.5166 17.3912L5.50253 14.3003Z" fill="#FBBC05"></path><path d="M12.24 4.74966C13.9509 4.7232 15.6044 5.36697 16.8434 6.54867L20.2695 3.12262C18.1001 1.0855 15.2208 -0.034466 12.24 0.000808666C7.7029 0.000808666 3.55371 2.55822 1.5166 6.61481L5.50253 9.70575C6.45064 6.86173 9.10947 4.74966 12.24 4.74966Z" fill="#EA4335"></path></svg>
</button>
<button class="h-12 w-12 rounded-full bg-slate-200 dark:bg-[#233c48] flex items-center justify-center hover:bg-slate-300 dark:hover:bg-[#2f4b5a] transition-colors">
<svg class="w-6 h-6 fill-current text-slate-900 dark:text-white" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M17.05 20.28c-.98.95-2.05.88-3.08.4-.69-.32-1.39-.32-2.05 0-1.1.53-2.14.61-3.23-.42-2.19-2.06-3.79-5.91-1.57-9.69 1.1-1.89 3.1-3.09 5.06-3.03 1.05.03 2.05.41 2.69.83.63-.42 1.83-.93 3.08-.85 1.3.09 2.76.62 3.63 1.87-3.19 1.9-2.65 6.43.83 7.82-.67 2.01-1.6 3.99-3.05 5.46-1.02 1.02-2.11 1.05-2.31 1.05zM12.03 7.25c-.14-2.5 2.03-4.66 4.47-4.88.24 2.8-2.6 4.96-4.47 4.88z"></path></svg>
</button>
</div>
<!-- Footer -->
<div class="mt-auto pb-8 flex flex-col items-center gap-2">
<p class="text-slate-500 dark:text-[#92b7c9] text-sm text-center">
                Don't have an account? 
                <a class="text-primary font-bold hover:underline" href="#">Sign Up</a>
</p>
</div>
<!-- Bottom spacing for iOS safe area -->
<div class="h-5"></div>
</div>
</body></html>
