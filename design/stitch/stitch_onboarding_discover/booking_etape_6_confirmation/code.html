<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#00D4FF",
                        "background-light": "#f6f7f8",
                        "background-dark": "#080810",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 antialiased">
<div class="relative flex h-auto min-h-screen w-full flex-col bg-background-light dark:bg-background-dark overflow-x-hidden">
<!-- Bottom Sheet Simulation Container -->
<div class="flex absolute top-0 left-0 h-full w-full flex-col justify-end items-stretch">
<!-- Backdrop Blur (Visual Decor) -->
<div class="absolute inset-0 bg-background-dark/40 backdrop-blur-sm"></div>
<!-- Bottom Sheet Content -->
<div class="relative flex flex-col items-stretch bg-white dark:bg-[#0c0c16] rounded-t-xl border-t border-primary/10 shadow-2xl">
<!-- BottomSheetHandle -->
<button class="flex h-6 w-full items-center justify-center">
<div class="h-1.5 w-12 rounded-full bg-slate-300 dark:bg-slate-700"></div>
</button>
<div class="flex-1">
<!-- Progress Header -->
<div class="flex flex-col gap-4 p-6">
<div class="flex gap-6 justify-between items-center">
<p class="text-slate-900 dark:text-white text-lg font-bold leading-normal">Booking Complete</p>
<p class="text-primary text-sm font-semibold leading-normal">6/6</p>
</div>
<div class="h-2 w-full rounded-full bg-primary/10">
<div class="h-full rounded-full bg-primary shadow-[0_0_8px_rgba(0,212,255,0.6)]" style="width: 100%;"></div>
</div>
</div>
<!-- Confirmation Body -->
<div class="flex flex-col px-6 py-8">
<div class="flex flex-col items-center gap-8">
<!-- Large Checkmark Icon -->
<div class="relative flex items-center justify-center h-24 w-24 rounded-full bg-primary/20 border-2 border-primary">
<span class="material-symbols-outlined text-primary text-6xl font-bold">check</span>
<!-- Pulse Effect -->
<div class="absolute inset-0 rounded-full bg-primary/20 animate-ping opacity-75"></div>
</div>
<div class="flex max-w-[480px] flex-col items-center gap-3">
<h2 class="text-slate-900 dark:text-white text-2xl font-bold leading-tight tracking-tight text-center">Reservation Confirmed</h2>
<div class="flex items-center gap-2 px-3 py-1 bg-emerald-500/10 text-emerald-500 rounded-full border border-emerald-500/20">
<span class="material-symbols-outlined text-sm">notifications_active</span>
<p class="text-sm font-medium leading-normal">Provider notified</p>
</div>
</div>
<!-- Reservation Code Card -->
<div class="w-full max-w-sm p-5 flex flex-col items-center gap-4 rounded-xl border border-primary/20 bg-primary/5">
<div class="text-center">
<p class="text-slate-500 dark:text-slate-400 text-xs uppercase tracking-widest font-bold mb-1">Reservation Code</p>
<p class="text-primary text-2xl mono font-bold tracking-widest">SPT-A3F9B2</p>
</div>
<button class="flex items-center gap-2 cursor-pointer hover:bg-primary/20 transition-colors px-4 py-2 rounded-full border border-primary/30 text-primary text-sm font-semibold">
<span class="material-symbols-outlined text-base">content_copy</span>
<span>Copy Code</span>
</button>
</div>
</div>
</div>
<!-- Action Buttons -->
<div class="flex justify-center border-t border-slate-200 dark:border-slate-800 bg-white/50 dark:bg-black/20">
<div class="flex flex-1 gap-4 max-w-[480px] flex-col items-stretch px-6 py-8">
<button class="flex items-center justify-center gap-2 overflow-hidden rounded-full h-14 px-6 bg-primary text-background-dark text-base font-bold leading-normal transition-transform active:scale-95 shadow-lg shadow-primary/20">
<span class="material-symbols-outlined">calendar_today</span>
<span class="truncate">Add to calendar</span>
</button>
<button class="flex items-center justify-center gap-2 overflow-hidden rounded-full h-14 px-6 bg-slate-200 dark:bg-slate-800 text-slate-900 dark:text-white text-base font-bold leading-normal transition-colors hover:bg-slate-300 dark:hover:bg-slate-700">
<span class="material-symbols-outlined">confirmation_number</span>
<span class="truncate">View my bookings</span>
</button>
</div>
</div>
</div>
<!-- Safe Area Spacer -->
<div class="h-8 bg-white dark:bg-[#0c0c16]"></div>
</div>
</div>
<!-- Background Design Elements (Decorative) -->
<div class="absolute top-10 left-10 w-64 h-64 bg-primary/10 rounded-full blur-[100px]"></div>
<div class="absolute bottom-40 right-10 w-80 h-80 bg-primary/5 rounded-full blur-[120px]"></div>
</div>
</body></html>
